[package]
name = "automower2mqtt"
version = "0.2.0"
edition = "2024"
license = "ISC"

[dependencies]
boot-time = "0.1.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
homie5 = "0.12.0"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls", "form", "stream", "charset", "json"] }
rumqttc = { version = "0.25.1", features = ["url"] }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = "1.53.3"
tokio-tungstenite = { version = "0.30.0", features = ["__rustls-tls", "rustls", "rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = "0.3.23"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
